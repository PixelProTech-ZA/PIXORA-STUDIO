name = "pixora-api"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
MAGIC_HOUR_MODEL = "default"          # Magic Hour picks the best model. Other options: nano-banana, qwen-edit, seedream-v4, flux-2-klein ...
ALLOWED_ORIGIN = "https://pixelprotech-za.github.io"   # origin only, no path. Comma-separate to add http://localhost:8080
MAX_UPLOAD_MB = "8"
RATE_LIMIT_PER_MIN = "6"
TIMEOUT_MS = "100000"
# Secrets (set with wrangler, never in this file): MAGIC_HOUR_API_KEY, optional PIXORA_ACCESS_KEY
